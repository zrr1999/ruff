<svg xmlns="http://www.w3.org/2000/svg" width="740" height="290"><style>.fg{fill:#aaa}.bg{fill:#000}.fg-bright-blue{fill:#55f}.fg-bright-red{fill:#f55}.container{padding:0 10px;line-height:18px}.bold{font-weight:700}tspan{font:14px SFMono-Regular,Consolas,Liberation Mono,Menlo,monospace;white-space:pre;line-height:18px}</style><rect width="100%" height="100%" y="0" class="bg" rx="4.5"/><text class="container fg" xml:space="preserve"><tspan x="10" y="28"><tspan class="fg-bright-red bold">error[E0308]</tspan><tspan class="bold">: mismatched types</tspan> </tspan> <tspan x="10" y="46"><tspan> </tspan><tspan class="fg-bright-blue bold">--&gt; </tspan><tspan>$DIR/file.txt:3:1</tspan> </tspan> <tspan x="10" y="64"><tspan> </tspan><tspan class="fg-bright-blue bold">|</tspan> </tspan> <tspan x="10" y="82"><tspan class="fg-bright-blue bold">3</tspan><tspan> </tspan><tspan class="fg-bright-blue bold">|</tspan><tspan> this is from a txt file</tspan> </tspan> <tspan x="10" y="100"><tspan> </tspan><tspan class="fg-bright-blue bold">|</tspan><tspan> </tspan><tspan class="fg-bright-blue bold">-----------------------</tspan><tspan> </tspan><tspan class="fg-bright-blue bold">the macro expands to this string</tspan> </tspan> <tspan x="10" y="118"><tspan> </tspan><tspan class="fg-bright-blue bold">|</tspan> </tspan> <tspan x="10" y="136"><tspan> </tspan><tspan class="fg-bright-blue bold">::: </tspan><tspan>$DIR/mismatched-types.rs:2:12</tspan> </tspan> <tspan x="10" y="154"><tspan> </tspan><tspan class="fg-bright-blue bold">|</tspan> </tspan> <tspan x="10" y="172"><tspan class="fg-bright-blue bold">2</tspan><tspan> </tspan><tspan class="fg-bright-blue bold">|</tspan><tspan> let b: &amp;[u8] = include_str!(&quot;file.txt&quot;);</tspan> </tspan> <tspan x="10" y="190"><tspan> </tspan><tspan class="fg-bright-blue bold">|</tspan><tspan> </tspan><tspan class="fg-bright-blue bold">-----</tspan><tspan> </tspan><tspan class="fg-bright-red bold">^^^^^^^^^^^^^^^^^^^^^^^^</tspan><tspan> </tspan><tspan class="fg-bright-red bold">expected `&amp;[u8]`, found `&amp;str`</tspan> </tspan> <tspan x="10" y="208"><tspan> </tspan><tspan class="fg-bright-blue bold">|</tspan><tspan> </tspan><tspan class="fg-bright-blue bold">|</tspan> </tspan> <tspan x="10" y="226"><tspan> </tspan><tspan class="fg-bright-blue bold">|</tspan><tspan> </tspan><tspan class="fg-bright-blue bold">expected due to this</tspan> </tspan> <tspan x="10" y="244"><tspan> </tspan><tspan class="fg-bright-blue bold">|</tspan> </tspan> <tspan x="10" y="262"><tspan> </tspan><tspan class="fg-bright-blue bold">= </tspan><tspan class="bold">note</tspan><tspan>: expected reference `&amp;[u8]`</tspan> </tspan> <tspan x="10" y="280"><tspan> found reference `&amp;&apos;static str`</tspan></tspan></text></svg>