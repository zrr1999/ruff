<svg xmlns="http://www.w3.org/2000/svg" width="944" height="290"><style>.fg{fill:#aaa}.bg{fill:#000}.fg-bright-blue{fill:#55f}.fg-bright-cyan{fill:#5ff}.fg-bright-red{fill:#f55}.fg-magenta{fill:#a0a}.container{padding:0 10px;line-height:18px}.bold{font-weight:700}tspan{font:14px SFMono-Regular,Consolas,Liberation Mono,Menlo,monospace;white-space:pre;line-height:18px}</style><rect width="100%" height="100%" y="0" class="bg" rx="4.5"/><text class="container fg" xml:space="preserve"><tspan x="10" y="28"><tspan class="fg-bright-red bold">error[E0277]</tspan><tspan class="bold">: the trait bound `CustomErrorHandler: ErrorHandler` is not satisfied</tspan> </tspan> <tspan x="10" y="46"><tspan> </tspan><tspan class="fg-bright-blue bold">--&gt; </tspan><tspan>src/main.rs:5:17</tspan> </tspan> <tspan x="10" y="64"><tspan> </tspan><tspan class="fg-bright-blue bold">|</tspan> </tspan> <tspan x="10" y="82"><tspan class="fg-bright-blue bold">5</tspan><tspan> </tspan><tspan class="fg-bright-blue bold">|</tspan><tspan> cnb_runtime(CustomErrorHandler {});</tspan> </tspan> <tspan x="10" y="100"><tspan> </tspan><tspan class="fg-bright-blue bold">|</tspan><tspan> </tspan><tspan class="fg-bright-blue bold">-----------</tspan><tspan> </tspan><tspan class="fg-bright-red bold">^^^^^^^^^^^^^^^^^^^^^</tspan><tspan> </tspan><tspan class="fg-bright-red bold">the trait `ErrorHandler` is not implemented for `CustomErrorHandler`</tspan> </tspan> <tspan x="10" y="118"><tspan> </tspan><tspan class="fg-bright-blue bold">|</tspan><tspan> </tspan><tspan class="fg-bright-blue bold">|</tspan> </tspan> <tspan x="10" y="136"><tspan> </tspan><tspan class="fg-bright-blue bold">|</tspan><tspan> </tspan><tspan class="fg-bright-blue bold">required by a bound introduced by this call</tspan> </tspan> <tspan x="10" y="154"><tspan> </tspan><tspan class="fg-bright-blue bold">|</tspan> </tspan> <tspan x="10" y="172"><tspan class="fg-bright-cyan bold">help</tspan><tspan>: </tspan><tspan class="bold">there are </tspan><tspan class="fg-magenta bold">multiple different versions</tspan><tspan class="bold"> of crate `</tspan><tspan class="fg-magenta bold">c</tspan><tspan class="bold">` in the dependency graph</tspan> </tspan> <tspan x="10" y="190"><tspan> </tspan><tspan class="fg-bright-blue bold">--&gt; </tspan><tspan>src/main.rs:1:5</tspan> </tspan> <tspan x="10" y="208"><tspan> </tspan><tspan class="fg-bright-blue bold">|</tspan> </tspan> <tspan x="10" y="226"><tspan class="fg-bright-blue bold">1</tspan><tspan> </tspan><tspan class="fg-bright-blue bold">|</tspan><tspan> use b::CustomErrorHandler;</tspan> </tspan> <tspan x="10" y="244"><tspan> </tspan><tspan class="fg-bright-blue bold">|</tspan><tspan> </tspan><tspan class="fg-bright-cyan bold">^</tspan><tspan> </tspan><tspan class="fg-bright-cyan bold">one version of crate `c` is used here, as a dependency of crate `b`</tspan> </tspan> <tspan x="10" y="262"><tspan class="fg-bright-blue bold">2</tspan><tspan> </tspan><tspan class="fg-bright-blue bold">|</tspan><tspan> use c::cnb_runtime;</tspan> </tspan> <tspan x="10" y="280"><tspan> </tspan><tspan class="fg-bright-blue bold">|</tspan><tspan> </tspan><tspan class="fg-bright-cyan bold">^</tspan><tspan> </tspan><tspan class="fg-bright-cyan bold">one version of crate `c` is used here, as a direct dependency of the current crate</tspan></tspan></text></svg>